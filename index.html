<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毎日リアル英語</title>

(function(){var off=false;try{off=localStorage.getItem("re-coi-off")==="1";}catch(e){}
window.coi={coepCredentialless:function(){return true;},quiet:true,shouldRegister:function(){return !off;},shouldDeregister:function(){return off;}};})();

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff5a36">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
<style>
/* 方向性：深夜の配信ドラマの「字幕」。紺の文字、コーラルの元気なアクセント、英語は読みやすい Lexend。 */
:root{
  --bg:#f6f3ee; --surface:#ffffff; --ink:#1b2333; --muted:#5f6878; --line:#e3ddd3;
  --accent:#ff5a36; --accent-ink:#ffffff; --accent-soft:#ffe6de;
  --en:#2449b8; --en-soft:#e5ecff; --good:#16834a; --good-soft:#def5e7; --bad:#cc3b3b; --bad-soft:#fde6e6; --warn:#9a6a00; --warn-soft:#fff3d1;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --font-en:"Lexend","Zen Kaku Gothic New",system-ui,sans-serif;
  --font-display:"Zen Maru Gothic","Zen Kaku Gothic New",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11151d; --surface:#1a202b; --ink:#e9edf3; --muted:#9ba5b4; --line:#2b3442;
  --accent:#ff7a59; --accent-ink:#1b0f0b; --accent-soft:#3a211a;
  --en:#8fb0ff; --en-soft:#1e2a48; --good:#5fd394; --good-soft:#143022; --bad:#ff8b8b; --bad-soft:#3a1a1a; --warn:#f0c04d; --warn-soft:#352a10;
  color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 110px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-display);line-height:1.35;margin:0;text-wrap:balance}
h1{font-size:1.4rem} h2{font-size:1.1rem} h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.en{font-family:var(--font-en);letter-spacing:.005em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;cursor:pointer;min-height:46px;text-align:center}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.icon:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 10px;font-size:.85rem;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 120px}
.icon{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;width:42px;height:42px;display:inline-grid;place-items:center;cursor:pointer;flex:none;font-size:1.05rem}
.icon.play{background:var(--en-soft);border-color:transparent;color:var(--en)}
.icon.gen{background:var(--warn-soft);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.icon.playing{background:var(--en);color:#fff}
.label{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.tag{font-size:.74rem;border-radius:6px;padding:2px 8px;background:var(--en-soft);color:var(--en);font-weight:700}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.flame{font-size:2rem;line-height:1}
.big{font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.week{display:flex;gap:6px}
.week span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;background:var(--line);color:var(--muted)}
.week span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.week span.today{outline:2px solid var(--accent);outline-offset:1px}
.mission{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.mission li{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;font-size:.92rem}
.mission .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem}
.mission .ck.on{background:var(--good);border-color:var(--good);color:#fff}
.art{display:block;width:100%;height:auto;border-radius:12px}
.artbox{position:relative;border-radius:12px;overflow:hidden;background:var(--line)}
.line{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--font-en);font-size:.85rem;color:#fff}
.who{font-size:.72rem;color:var(--muted)}
.say{font-family:var(--font-en);font-size:1.05rem;line-height:1.5}
.wd{cursor:pointer;border-radius:4px;padding:0 1px}
.wd.on{background:var(--en);color:#fff}
.wchips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-family:var(--font-en);cursor:pointer;min-height:36px}
.wchip.on{background:var(--en);color:#fff;border-color:var(--en)}
.btn.listening{background:var(--bad);border-color:var(--bad);color:#fff}
.recbox{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.say mark{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--accent)}
.ja{font-size:.86rem;color:var(--muted)}
.line.me .say{color:var(--en)}
.line.now{background:var(--en-soft);border-radius:10px}
.hiddenText .wd{pointer-events:none}
.hiddenText .say,.hiddenText .ja{filter:blur(6px);user-select:none}
.ph{display:flex;flex-direction:column;gap:8px}
.ph .pic{font-size:2.2rem;line-height:1.2}
.ph .head{display:flex;gap:10px;align-items:center}
.ph .phen{font-family:var(--font-en);font-size:1.45rem;font-weight:600;color:var(--en);line-height:1.3}
.note{font-size:.86rem;color:var(--muted)}
.mimi{border-radius:12px;padding:12px 14px;background:var(--warn-soft);display:flex;flex-direction:column;gap:6px}
.mimi-t{font-family:var(--font-display);font-size:1.4rem;line-height:1.4}
.mimi-y{font-size:.85rem;color:var(--muted)}
.tip{border-radius:10px;padding:8px 12px;background:var(--warn-soft);color:var(--ink);font-size:.86rem}
.tip b{color:var(--warn)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ng{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.verdict{border-radius:12px;padding:10px 14px;font-weight:700}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.ng{background:var(--bad-soft);color:var(--bad)}
.verdict p{font-weight:400;color:var(--ink);font-size:.9rem;margin-top:2px}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent);font-weight:700}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.foot{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:16px 14px calc(14px + env(safe-area-inset-bottom))}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.foot .btn{flex:1;padding-left:8px;padding-right:8px;white-space:nowrap}
textarea.say-in{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-family:var(--font-en);font-size:1rem;resize:vertical}
.words{font-family:var(--font-en);font-size:1.05rem;line-height:1.9}
.words span{padding:1px 3px;border-radius:4px;margin-right:2px}
.words .w-ok{background:var(--good-soft);color:var(--good)}
.words .w-miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.score{font-family:var(--font-display);font-size:1.5rem}
.ai{border-left:3px solid var(--en);padding:2px 0 2px 12px;font-size:.92rem;white-space:pre-wrap}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.msg.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--en-soft);align-self:flex-end;border-bottom-right-radius:4px}
.msg .fix{font-size:.82rem;background:var(--warn-soft);border-radius:8px;padding:6px 8px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.scene-btn{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%}
.scene-btn .thumb{width:64px;height:40px;border-radius:8px;overflow:hidden}
.scene-btn .thumb svg{width:100%;height:100%}
.done-mark{color:var(--good);font-weight:700;font-size:.85rem}
.road{display:flex;flex-direction:column;gap:10px}
.road .st{display:grid;grid-template-columns:30px 1fr 3.5rem;gap:8px;align-items:center;font-size:.88rem}
.road .num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:700;font-size:.85rem}
.road .num.on{background:var(--accent);color:var(--accent-ink)}
.banner{border-radius:12px;padding:10px 12px;font-size:.86rem;background:var(--warn-soft)}
.hidden{display:none!important}
details summary{cursor:pointer;font-weight:700}
select{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);min-height:42px;max-width:100%}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:30;max-width:92vw}
.xp-pop{font-family:var(--font-display);color:var(--accent);font-size:2.4rem;text-align:center}
.center{text-align:center}
input[type=search]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);min-height:44px}
@media (prefers-reduced-motion:no-preference){.btn,.opt,.chip,.icon{transition:border-color .12s,background-color .12s,transform .08s}.btn:active,.opt:active{transform:scale(.98)}}
@media (min-width:900px){.wrap{max-width:720px}.foot .in{max-width:720px}}
</style>
</head>

<script>

const ART=(function(){
const W=360,H=150;

const person=(x,y,c,hair,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-14" y="18" width="28" height="34" rx="12" fill="${c}"/><circle cx="0" cy="6" r="13" fill="#f2c9a5"/><path d="M-13 4 Q0 -14 13 4 Q12 -6 0 -8 Q-12 -6 -13 4Z" fill="${hair}"/><circle cx="-4.5" cy="7" r="1.6" fill="#2a2a2a"/><circle cx="4.5" cy="7" r="1.6" fill="#2a2a2a"/><path d="M-4 12 Q0 15 4 12" stroke="#a5583c" stroke-width="1.6" fill="none" stroke-linecap="round"/></g>`;
const bubble=(x,y,t)=>`<g transform="translate(${x} ${y})"><rect x="0" y="0" width="${t.length*9+18}" height="24" rx="12" fill="#fff" stroke="#1b2333" stroke-width="1.5"/><path d="M12 24 L8 32 L20 24Z" fill="#fff" stroke="#1b2333" stroke-width="1.5" stroke-linejoin="round"/><rect x="10" y="22" width="12" height="4" fill="#fff"/><text x="9" y="17" font-size="13" font-family="Lexend,sans-serif" font-weight="600" fill="#1b2333">${t}</text></g>`;
const K={
home:()=>wrap("#ffe9d6",`<rect y="112" width="360" height="38" fill="#e7b98f"/><rect x="34" y="22" width="80" height="62" rx="4" fill="#bfe3ff" stroke="#fff" stroke-width="5"/><line x1="74" y1="22" x2="74" y2="84" stroke="#fff" stroke-width="4"/><circle cx="98" cy="40" r="9" fill="#fff6b0"/><rect x="150" y="78" width="130" height="42" rx="14" fill="#5b7bd5"/><rect x="142" y="70" width="22" height="50" rx="10" fill="#4867c2"/><rect x="266" y="70" width="22" height="50" rx="10" fill="#4867c2"/><rect x="300" y="40" width="6" height="74" fill="#6b4b33"/><path d="M286 40 L320 40 L312 22 L294 22Z" fill="#ffd166"/><path d="M20 112 q8 -30 16 0" fill="#3fa36b"/><rect x="18" y="104" width="20" height="14" rx="3" fill="#c1663c"/>${person(186,48,"#ff7a59","#3b2a20")}${person(236,48,"#2fb39a","#7a4a2a")}${bubble(196,6,"Hey!")}`,"部屋の中"),
cafe:()=>wrap("#f7e7d0",`<rect x="20" y="14" width="120" height="58" rx="6" fill="#2d3b36"/><text x="32" y="34" font-size="12" fill="#f5f0e6" font-family="Lexend,sans-serif">MENU</text><line x1="32" y1="44" x2="124" y2="44" stroke="#f5f0e6" stroke-width="2" stroke-dasharray="3 4"/><line x1="32" y1="56" x2="110" y2="56" stroke="#f5f0e6" stroke-width="2" stroke-dasharray="3 4"/>${person(210,44,"#2e7d5b","#2a1c14")}<rect y="96" width="360" height="54" fill="#8b5a3c"/><rect y="92" width="360" height="8" fill="#a8714c"/><rect x="262" y="58" width="44" height="38" rx="4" fill="#9aa5ad"/><rect x="270" y="66" width="28" height="10" rx="2" fill="#5b666e"/><path d="M60 92 h22 l-3 -20 h-16z" fill="#fff"/><path d="M82 78 q10 0 6 9" stroke="#fff" stroke-width="3" fill="none"/><path d="M66 66 q4 -6 0 -12 M74 66 q4 -6 0 -12" stroke="#c9b6a3" stroke-width="2" fill="none"/>${bubble(232,6,"To go?")}`,"カフェ"),
street:()=>wrap("#cfe8ff",`<circle cx="300" cy="30" r="16" fill="#ffd166"/><rect x="10" y="40" width="60" height="80" fill="#8fa6c9"/><rect x="74" y="20" width="54" height="100" fill="#6f87b0"/><rect x="230" y="50" width="70" height="70" fill="#8fa6c9"/>${[0,1,2,3].map(i=>`<rect x="${84+(i%2)*22}" y="${32+Math.floor(i/2)*24}" width="12" height="14" fill="#fff6b0"/>`).join("")}${[0,1,2].map(i=>`<rect x="${20+i*16}" y="54" width="10" height="12" fill="#fff6b0"/>`).join("")}<rect y="118" width="360" height="32" fill="#9b9b9b"/><rect y="114" width="360" height="6" fill="#c9c9c9"/><rect x="186" y="44" width="4" height="72" fill="#3c4a5c"/><circle cx="188" cy="42" r="7" fill="#fff6b0" stroke="#3c4a5c" stroke-width="3"/>${person(150,66,"#ff7a59","#3b2a20")}${person(222,66,"#2fb39a","#7a4a2a")}`,"街の中"),
party:()=>wrap("#2f2a5a",`<path d="M0 20 Q90 50 180 20 T360 20" stroke="#ffe08a" stroke-width="2" fill="none"/>${[20,60,100,140,180,220,260,300,340].map((x,i)=>`<circle cx="${x}" cy="${26+(i%2)*10}" r="5" fill="${["#ff7a59","#ffd166","#7ae0c3","#9aa8ff"][i%4]}"/>`).join("")}<ellipse cx="40" cy="60" rx="14" ry="18" fill="#ff7a9c"/><line x1="40" y1="78" x2="44" y2="120" stroke="#fff" stroke-width="1"/><ellipse cx="320" cy="56" rx="14" ry="18" fill="#7ae0c3"/><line x1="320" y1="74" x2="316" y2="120" stroke="#fff" stroke-width="1"/><rect y="118" width="360" height="32" fill="#4a3f7a"/><rect x="250" y="96" width="70" height="8" rx="2" fill="#c49a6c"/><rect x="262" y="80" width="10" height="16" rx="2" fill="#7ae0c3"/><rect x="282" y="76" width="10" height="20" rx="2" fill="#ffd166"/><rect x="300" y="82" width="10" height="14" rx="2" fill="#ff7a59"/>${person(130,58,"#ffd166","#2a1c14")}${person(186,58,"#9aa8ff","#5a3a1a")}${bubble(140,10,"Glad you made it!")}`,"パーティー"),

const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};

  let m;if((m=w.match(/^(.+)n't$/)))return [m[1],"not"];
  if((m=w.match(/^(.+)'(m|re|ll|ve|d|s)$/)))return [m[1],{m:"am",re:"are",ll:"will",ve:"have",d:"would",s:"is"}[m[2]]];

function bindLesson(){const sc=L.sc;const on=(s,f)=>{const el=$(s);if(el)el.onclick=f;};

function advanceLesson(){stopSpeak();stopListen();if(L.step===4)clearRec();

function startReview(){const now=Date.now();let ids=dueIds(now).sort((a,b)=>(recallNow(a,now)??1)-(recallNow(b,now)??1)).slice(0,S.settings.revCap);

      <div class="opts">${c.opts.map((o,k)=>{let cls="opt";if(c.pick!==null){if(o===p.ja)cls+=" ok";else if(k===c.pick)cls+=" ng";}return `<button class="${cls}" data-rk="${k}" ${c.pick!==null?"disabled":""}>${esc(o)}</button>`;}).join("")}</div>

async function aiExamples(p,box,btn){if(EX_CACHE[p.id]){box.innerHTML=EX_CACHE[p.id];return;}btn.disabled=true;box.innerHTML=`<p class="note">AIが例文を作っています…</p>`;
  try{const t=await ask(`${LEARNER}
Give 3 short, natural example sentences (casual American English, max 10 words each, easy words) that use the phrase "${p.en}" (meaning in Japanese: ${p.ja}). Vary the situations (friends, work, TV drama).
Reply ONLY with JSON: {"examples":[{"en":"...","ja":"natural Japanese translation"}]}`,{modelTier:"quick"});
    const j=pickJSON(t);const ex=(j.examples||[]).slice(0,3).filter(x=>x&&x.en);
    const html=`<ul class="list">${ex.map(x=>`<li><div class="row" style="flex-wrap:nowrap">${playBtn(x.en,"f")}<div><div class="en">${esc(x.en)}</div><div class="ja">${esc(x.ja)}</div></div></div></li>`).join("")}</ul>`;
    EX_CACHE[p.id]=html;box.innerHTML=html;btn.remove();ex.forEach(x=>prefetch(x.en,"af_heart"));}
  catch(e){box.innerHTML=`<p class="note">${esc(aiErr(e))}</p>`;btn.disabled=false;}}
async function aiAdvice(target,heard,box,btn){btn.disabled=true;box.innerHTML=`<div class="ai">考えています…</div>`;
  try{await ask(`A Japanese beginner tried to say this English sentence aloud: "${target}"
Speech recognition heard: "${heard}"
In Japanese, give short, concrete pronunciation advice: at most 3 bullet points ("・"), each under 50 characters. Say which words were probably misheard and why (typical issues for Japanese speakers: L/R, TH, V/B, F/H, dropping final consonants, adding vowels after consonants, flat rhythm, missing linking). Use katakana approximations where it helps (e.g. チェキラウ). If it was recognized perfectly, praise briefly and give one tip to sound more natural (rhythm, stress or linking). Plain text only, no markdown.`,
    {modelTier:"quick",onText:({text})=>{box.innerHTML=`<div class="ai">${esc(text)}</div>`;}});btn.remove();}
  catch(e){box.innerHTML=`<p class="note">${esc(aiErr(e))}</p>`;btn.disabled=false;}}

function talkHistory(){const m=[{role:"user",content:"(Begin the role-play now with your first line.)"}];T.msgs.forEach(x=>{if(x.who==="ai")m.push({role:"assistant",content:x.raw});else m.push({role:"user",content:x.text});});

  /* 同じ役が続いたらまとめる */
  const merged=[];out.forEach(x=>{const last=merged[merged.length-1];if(last&&last.role===x.role)last.content+="\n"+x.content;else merged.push({role:x.role,content:x.content});});

async function makeScene(){MK.busy=true;MK.err="";renderMake();const stg=stageOf(MK.stage);

function validScene(j){const str=x=>typeof x==="string"&&x.trim();
  const lines=(j.lines||[]).filter(l=>l&&str(l.s)&&str(l.en)).slice(0,9).map(l=>({s:l.s.trim().slice(0,20),en:l.en.trim(),ja:String(l.ja||"")}));
  if(lines.length<3)throw new Error("lines");
  const sc={title:String(j.title||"AIシーン").slice(0,30),place:String(j.place||""),art:String(j.art||"street"),lines,phrases:[]};
  (j.phrases||[]).forEach(p=>{if(!p||!str(p.en)||!str(p.hit))return;if(!lines.some(l=>l.en.toLowerCase().includes(p.hit.toLowerCase())))return;
    sc.phrases.push({en:p.en.trim(),hit:p.hit.trim(),ja:String(p.ja||""),note:String(p.note||""),sound:String(p.sound||""),pic:String(p.pic||"💬").slice(0,8),mimi:String(p.mimi||"").slice(0,40),yomi:String(p.yomi||"").slice(0,60)});});
  if(sc.phrases.length<2)throw new Error("phrases");sc.phrases=sc.phrases.slice(0,5);
  const g=j.gist||{};sc.gist=Array.isArray(g.c)&&g.c.length>=2?{q:String(g.q||"何の話？"),c:g.c.slice(0,3).map(String),a:Math.min(Math.max(0,+g.a||0),g.c.length-1)}:{q:"何の話？",c:[sc.place||"日常の会話","仕事の会議","ニュース"],a:0};
  return sc;}
